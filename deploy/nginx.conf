events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api_upstream {
        least_conn;
        server api:8080;
    }

    # Blazor Server usa SignalR: sesiones fijas por cliente (ip_hash).
    upstream web_upstream {
        ip_hash;
        server web:8080;
    }

    server {
        listen 80;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;

        location /api/    { proxy_pass http://api_upstream; }
        location /agent/   { proxy_pass http://api_upstream; }
        location /health   { proxy_pass http://api_upstream; }
        location /swagger/ { proxy_pass http://api_upstream; }
        location /agents/  { proxy_pass http://api_upstream; }
        location /         { proxy_pass http://web_upstream; }
    }
}
