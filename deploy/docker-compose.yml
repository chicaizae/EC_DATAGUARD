services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ec_dataguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ec_dataguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ec_dataguard -d ec_dataguard"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=ec_dataguard;Username=ec_dataguard;Password=${POSTGRES_PASSWORD:-change-me}
      Jwt__Secret: ${JWT_SECRET:-dev-only-secret-change-in-production-1234567890abcdef}
      Jwt__Issuer: ${JWT_ISSUER:-https://dataguard.local}
      Jwt__Audience: ${JWT_AUDIENCE:-ec-dataguard-console}
      Admin__Email: ${ADMIN_EMAIL:-admin@ecodataguard.local}
      Admin__InitialPassword: ${ADMIN_INITIAL_PASSWORD:-Admin*EcDataguard2026}
      Siem__Enabled: "false"
      Agent__ServerUrl: "${PUBLIC_BASE_URL:-http://localhost:8081}/api"
      Agent__DownloadBaseUrl: "${PUBLIC_BASE_URL:-http://localhost:8081}"
    volumes:
      - ./agent/dist:/app/agents:ro
      - apidata:/app/data
    mem_limit: 512m
    # Sin puertos publicados: se accede mediante el proxy (escalable).

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      Api__BaseUrl: http://api:8080
      Redis__Configuration: redis:6379
    mem_limit: 512m

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "${PUBLIC_HTTP_PORT:-8081}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  apidata: