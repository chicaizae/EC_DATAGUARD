name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore EcDataguard.sln

      - name: Build
        run: dotnet build EcDataguard.sln -c Release --no-restore

      - name: Test
        run: dotnet test EcDataguard.sln -c Release --no-build --verbosity minimal